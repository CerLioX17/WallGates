[package]
name = "wallgates"
version = "0.10.4"
description = "Open-source, fully customizable live wallpaper engine"
authors = ["Wallgates contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "wallgates_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
percent-encoding = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk", "network", "component"] }
base64 = "0.22"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
rustfft = "6"
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
  "Wdk_Graphics_Direct3D",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
