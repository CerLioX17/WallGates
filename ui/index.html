<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallgates</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="icon.png" alt="" width="22" height="22" />
      <span data-tauri-drag-region>Wallgates</span>
    </div>
    <button id="status" class="pill running" data-tauri-drag-region></button>
    <div class="spacer" data-tauri-drag-region></div>
    <div class="quick">
      <button id="q-pause" class="icon-btn" data-i18n-title="action.pause"></button>
      <button id="q-next" class="icon-btn" data-i18n-title="action.next"></button>
      <button id="q-mute" class="icon-btn" data-i18n-title="action.mute"></button>
    </div>
    <div class="win-controls">
      <button id="w-min" class="win-btn" aria-label="Minimize"></button>
      <button id="w-max" class="win-btn" aria-label="Maximize"></button>
      <button id="w-close" class="win-btn close" aria-label="Close"></button>
    </div>
  </header>

  <div id="app">
    <nav id="sidebar">
      <button class="nav" data-route="library"><span class="ico" data-icon="grid"></span><span data-i18n="nav.library"></span></button>
      <button class="nav" data-route="displays"><span class="ico" data-icon="monitor"></span><span data-i18n="nav.displays"></span></button>
      <button class="nav" data-route="playlists"><span class="ico" data-icon="list"></span><span data-i18n="nav.playlists"></span></button>
      <button class="nav" data-route="gallery"><span class="ico" data-icon="sparkles"></span><span data-i18n="nav.gallery"></span></button>
      <button class="nav" data-route="create"><span class="ico" data-icon="code"></span><span data-i18n="nav.create"></span></button>
      <div class="nav-spacer"></div>
      <div id="update-banner" hidden></div>
      <button class="nav" data-route="settings"><span class="ico" data-icon="settings"></span><span data-i18n="nav.settings"></span></button>
      <div class="sidebar-foot"><span id="version"></span></div>
    </nav>
    <main id="view"></main>
  </div>

  <div id="drop-overlay" hidden><div class="drop-card"><span class="ico big" data-icon="download"></span><p data-i18n="lib.dropHint"></p></div></div>
  <div id="toast" hidden></div>
  <div id="modal-root"></div>
  <div id="onboarding" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
