<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/__wallgates/wallgates-sdk.js"></script>
<style>
  /* Palettes follow the Windows Terminal schemes (Campbell / PowerShell). */
  :root { --desk: #000; --bg: #0c0c0c; --fg: #cccccc; --hi: #f2f2f2; --dim: #767676; --lab: #3a96dd;
          --ok: #13a10e; --warn: #c19c00; --bad: #e74856; --acc: #61d6d6; --bar: #3b3b3b; --title: #1f1f1f; --fs: 14px; --w: 42vw; --op: 0.94; }
  body.powershell { --bg: #012456; --fg: #eeedf0; --hi: #ffffff; --dim: #8a9cc2; --lab: #f9f1a5; --ok: #16c60c; --warn: #f9f1a5; --bad: #ff6b6b; --acc: #61d6d6; --bar: #24427a; --title: #0a1f47; }
  body.wallgates { --bg: #0b0a14; --fg: #d4d7f5; --hi: #ffffff; --dim: #6e7199; --lab: #a78bfa; --ok: #22d3ee; --warn: #fbbf24; --bad: #fb7185; --acc: #22d3ee; --bar: #24223a; --title: #141226; }
  body.green { --bg: #000a02; --fg: #33ff66; --hi: #b6ffcb; --dim: #1f8c3f; --lab: #7dff9f; --ok: #33ff66; --warn: #d6ff33; --bad: #ff5555; --acc: #b6ffcb; --bar: #0a2a12; --title: #021405; }
  body.amber { --bg: #0a0600; --fg: #ffb000; --hi: #ffd27a; --dim: #9a6a10; --lab: #ffd27a; --ok: #ffb000; --warn: #ffe08a; --bad: #ff5a36; --acc: #ffd27a; --bar: #2a1a00; --title: #140c00; }
  body.bg-graphite { --desk: #1a1b1f; }
  body.bg-navy { --desk: #0a1226; }
  body.bg-wallgates { --desk: linear-gradient(160deg, #0d0b1d 0%, #07070e 55%, #0b1320 100%); }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--desk); display: flex; padding: 3.2vh 2.4vw; font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Lucida Console", ui-monospace, monospace; }
  body.pos-right { justify-content: flex-end; align-items: center; }
  body.pos-left { justify-content: flex-start; align-items: center; }
  body.pos-center { justify-content: center; align-items: center; }
  body.pos-top-right { justify-content: flex-end; align-items: flex-start; }
  body.pos-top-left { justify-content: flex-start; align-items: flex-start; }
  body.pos-bottom-right { justify-content: flex-end; align-items: flex-end; }
  body.pos-bottom-left { justify-content: flex-start; align-items: flex-end; }

  .win { width: var(--w); max-height: 100%; display: flex; flex-direction: column; background: color-mix(in srgb, var(--bg) calc(var(--op) * 100%), transparent);
         border: 1px solid color-mix(in srgb, var(--dim) 45%, transparent); box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.55); }
  .title { display: flex; align-items: center; gap: 0.7em; height: 2.1em; padding: 0 0 0 0.8em; background: var(--title); color: var(--fg);
           font: calc(var(--fs) * 0.82) "Segoe UI", system-ui, sans-serif; flex: none; }
  .title .ico { width: 1.25em; height: 1.25em; border: 1px solid var(--dim); font: 700 0.7em/1.6 Consolas, monospace; text-align: center; color: var(--fg); }
  .title .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
  .title .ctl { display: flex; height: 100%; }
  .title .ctl span { width: 3.2em; display: grid; place-items: center; opacity: 0.75; }
  pre { margin: 0; padding: 0.7em 1em 0.9em; font-size: var(--fs); line-height: 1.32; font-family: inherit; color: var(--fg); white-space: pre; overflow: hidden; }
  .hi { color: var(--hi); } .dim { color: var(--dim); } .lab { color: var(--lab); } .acc { color: var(--acc); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .barbg { color: var(--bar); }
  .cursor { display: inline-block; width: 0.6em; height: 1.05em; vertical-align: -0.15em; background: var(--fg); animation: blink 1.06s steps(2) infinite; }
  body.paused .cursor { animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .logo { color: var(--lab); }
</style>
</head>
<body class="cmd pos-right bg-black">
<div class="win" id="win">
  <div class="title" id="title"><span class="ico">C:\</span><span class="name" id="titleText">Wallgates — Command Prompt</span><span class="ctl"><span>&#x2014;</span><span>&#x2610;</span><span>&#x2715;</span></span></div>
  <pre id="out"></pre>
</div>
<script>
// System Terminal v3 — Wallgates built-in wallpaper (CC BY 4.0). A plain command prompt, no effects.
const $ = (id) => document.getElementById(id);
const lang = navigator.language || 'en-US';
const COLS = 84;
const LOGO = [
  '      ▄▄▄██████▄▄▄',
  '   ▄██▀▀ .:░░:. ▀▀██▄',
  ' ▄█▀   .:░▒▓▓▒░:.   ▀█▄',
  ' ██  .:░▒▓▓▓▓▓▓▒░:.  ██',
  ' ██  ~~~~~~~~~~~~~~  ██',
  ' ██  ░▒▒▓▓▓▓▓▓▓▓▒▒░  ██',
  '▀██▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀██▀',
];
let o = {}, s = null, w = null, media = null;
let typed = '', typingDone = false;
const hist = { cpu: [], gpu: [], ram: [], ssd: [] };

// ---------------------------------------------------------------- text helpers
// A line is a list of [text, class] segments; rendering escapes everything.
const seg = (t, c) => [String(t), c || ''];
const pad = (t, n) => { t = String(t); return t.length >= n ? t.slice(0, n) : t + ' '.repeat(n - t.length); };
const lpad = (t, n) => { t = String(t); return t.length >= n ? t.slice(0, n) : ' '.repeat(n - t.length) + t; };
const bytes = (b) => { if (b == null || !isFinite(b)) return '—'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return `${b.toFixed(b < 10 && i ? 1 : 0)} ${u[i]}`; };
const rate = (b) => (b == null ? '—' : bytes(b) + '/s');
const deg = (c) => (c == null ? '  — ' : o.fahrenheit ? `${Math.round(c * 9 / 5 + 32)}°F` : `${Math.round(c)}°C`);
const lvl = (v, warn, bad) => (v == null ? 'dim' : v >= bad ? 'bad' : v >= warn ? 'warn' : 'ok');
const SPARK = '▁▂▃▄▅▆▇█';
const clip = (t, n) => { t = String(t); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
const spark = (arr) => arr.slice(-12).map((v) => (v == null ? ' ' : SPARK[Math.min(7, Math.floor((v / 100) * 8))])).join('');
const push = (a, v) => { a.push(v ?? null); while (a.length > 30) a.shift(); };

// htop-style meter: [||||||||          48.0%]
function meter(v, width, warn, bad) {
  if (v == null) return [seg('['), seg(' '.repeat(width), 'barbg'), seg(lpad('n/a', 6), 'dim'), seg(']')];
  const inner = width;
  const n = Math.round(Math.max(0, Math.min(100, v)) / 100 * inner);
  return [seg('['), seg('|'.repeat(n), lvl(v, warn, bad)), seg(' '.repeat(inner - n)), seg(lpad(`${v.toFixed(1)}%`, 6), 'hi'), seg(']')];
}

// ---------------------------------------------------------------- build output
function lines() {
  const L = [];
  const user = String(o.operator || 'Operator').replace(/[^\w.-]/g, '') || 'Operator';
  const prompt = `C:\\Users\\${user}>`;
  L.push([seg(`Wallgates OS [Version ${'0.6'}]`, 'dim')]);
  L.push([seg('(c) Wallgates contributors. GPL-3.0.', 'dim')]);
  L.push([]);
  L.push([seg(prompt), seg(' '), seg(typed, 'hi'), typingDone ? seg('') : ['', 'cursor']]);
  if (!typingDone) return L;
  L.push([]);

  if (o.showLogo) { for (const l of LOGO) L.push([seg('  ' + l, 'logo')]); L.push([]); }

  const now = new Date();
  const time = now.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !o.format24 });
  const date = now.toLocaleDateString(lang, { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  L.push([seg(' TIME     ', 'lab'), seg(time, 'hi'), seg(`  ${date}`)]);
  if (s) {
    const up = s.uptime || 0;
    L.push([seg(' HOST     ', 'lab'), seg(`${s.host || '?'}`, 'hi'), seg(`  ${s.os || ''}`), seg(`  up ${Math.floor(up / 86400)}d ${String(Math.floor(up % 86400 / 3600)).padStart(2, '0')}:${String(Math.floor(up % 3600 / 60)).padStart(2, '0')}`, 'dim')]);
  }
  L.push([]);

  if (!s) { L.push([seg(' Collecting system data…', 'dim')]); return L; }
  const g = s.gpu || {};
  const drives = s.drives || [];
  const sys = drives.find((d) => /C:/i.test(d.letters || '')) || drives[0] || {};
  const vol = (s.disks || []).find((d) => /^C:/i.test(d.mount || '')) || (s.disks || [])[0];

  // Device table
  L.push([seg(' ' + pad('DEVICE', 9), 'lab'), seg(pad('LOAD', 30), 'lab'), seg(lpad('TEMP', 6), 'lab'), seg('  INFO', 'lab')]);
  const row = (name, load, temp, warnT, badT, info) => L.push([seg(' ' + pad(name, 9), 'hi'), ...meter(load, 22, o.loadMax - 15, o.loadMax), seg('  '), seg(lpad(deg(temp), 5), lvl(temp, warnT, badT)), seg('  ' + clip(info, COLS - 50), 'dim')]);
  const cpuName = String(s.cpuName || 'CPU').replace(/\(R\)|\(TM\)|CPU|Processor|\d+-Core/gi, '').replace(/\s+/g, ' ').trim();
  row('CPU', s.cpu, s.cpuTemp, o.cpuTempMax - 10, o.cpuTempMax, `${cpuName} · ${s.cpuFreq ? (s.cpuFreq / 1000).toFixed(2) + ' GHz' : ''}${s.cpuPower != null ? ' · ' + Math.round(s.cpuPower) + ' W' : ''} · ${(s.cores || []).length}T`);
  const gpuName = String(g.name || 'n/a').replace(/NVIDIA |GeForce |AMD |Radeon |\(R\)/g, '');
  row('GPU', g.usage, g.temp, o.gpuTempMax - 10, o.gpuTempMax, `${gpuName}${g.vramTotal ? ` · VRAM ${bytes(g.vramUsed)}/${bytes(g.vramTotal)}` : ''}${g.fan ? ` · ${g.fan} rpm` : ''}`);
  row('RAM', s.memory, s.ramTemp, 55, 70, `${bytes(s.memoryUsed)}/${bytes(s.memoryTotal)} · free ${bytes(s.memoryAvailable)}${s.ramTemp == null ? ' · temp: no sensor' : ''}`);
  const ssdName = String(sys.model || 'disk').replace(/Samsung SSD |WDC |WD_BLACK /i, '').slice(0, 16);
  row(`SSD ${(sys.letters || '').split(' ')[0] || ''}`.trim(), sys.active, sys.temp, o.ssdTempMax - 10, o.ssdTempMax,
    `${ssdName} · R ${rate(sys.read)} W ${rate(sys.write)}${vol ? ` · ${bytes(vol.used)}/${bytes(vol.total)}` : ''}`);
  for (const d of drives.filter((d) => d !== sys).slice(0, 2)) {
    row(`SSD ${(d.letters || '').split(' ')[0] || d.index}`, d.active, d.temp, o.ssdTempMax - 10, o.ssdTempMax, `${String(d.model || '').slice(0, 16)} · R ${rate(d.read)} W ${rate(d.write)}`);
  }
  if (o.showHistory) {
    L.push([seg(' ' + pad('HISTORY', 9), 'lab'), seg('cpu ', 'dim'), seg(pad(spark(hist.cpu), 12), 'acc'), seg('  gpu ', 'dim'), seg(pad(spark(hist.gpu), 12), 'acc'),
      seg('  ram ', 'dim'), seg(pad(spark(hist.ram), 12), 'acc'), seg('  ssd ', 'dim'), seg(pad(spark(hist.ssd), 12), 'acc')]);
  }
  L.push([]);

  if (o.showProcs) {
    L.push([seg(' ' + pad('TOP', 9), 'lab'), seg(pad('#  PROCESS', 30), 'lab'), seg(lpad('CPU', 7), 'lab'), seg(lpad('MEMORY', 10), 'lab')]);
    (s.processes || []).slice(0, 5).forEach((p, i) => {
      const name = p.name + (p.count > 1 ? ` (${p.count})` : '');
      L.push([seg(' ' + ' '.repeat(9)), seg(`${i + 1}  `, 'dim'), seg(pad(name, 27), 'hi'), seg(lpad(`${p.cpu.toFixed(1)}%`, 7), lvl(p.cpu, 40, 80)), seg(lpad(bytes(p.memory), 10))]);
    });
    L.push([]);
  }

  if (o.showNet) {
    L.push([seg(' ' + pad('NETWORK', 9), 'lab'), seg('down ', 'dim'), seg(pad(rate(s.net?.rx), 13), 'hi'), seg('up ', 'dim'), seg(pad(rate(s.net?.tx), 13), 'hi')]);
    const fans = s.fans || [];
    if (fans.length) L.push([seg(' ' + pad('FANS', 9), 'lab'), seg(fans.slice(0, 5).map((f) => `${f.label} ${f.rpm}`).join(' · '))]);
    L.push([]);
  }

  if (o.showWeather) {
    if (!w) {
      L.push([seg(' ' + pad('WEATHER', 9), 'lab'), seg('offline — Wallgates → Settings → Weather & location', 'dim')]);
    } else {
      const uvTxt = (u) => (u == null ? '—' : u < 3 ? 'low' : u < 6 ? 'moderate' : u < 8 ? 'high' : u < 11 ? 'very high' : 'extreme');
      const aqTxt = (a) => (a == null ? '—' : a <= 20 ? 'good' : a <= 40 ? 'fair' : a <= 60 ? 'moderate' : a <= 80 ? 'poor' : 'very poor');
      const uvCls = (u) => (u == null ? 'dim' : u >= 8 ? 'bad' : u >= 6 ? 'warn' : 'ok');
      const city = String(w.location || '').split(',')[0];
      L.push([seg(' ' + pad('WEATHER', 9), 'lab'), seg(`${city} `, 'hi'), seg(`${Math.round(w.temperature)}${w.units || '°'} `, 'hi'), seg(clip(`${String(w.description || '').toLowerCase()} · feels ${Math.round(w.feelsLike)}° · hum ${Math.round(w.humidity)}% · wind ${Math.round(w.wind)} ${w.windUnits || ''}`, COLS - 18 - city.length))]);
      L.push([seg(' ' + ' '.repeat(9)), seg('UV ', 'dim'), seg(`${w.uv != null ? Math.round(w.uv) : '—'} ${uvTxt(w.uv)}`, uvCls(w.uv)), seg(' · AQI ', 'dim'), seg(`${w.air?.aqi != null ? Math.round(w.air.aqi) : '—'} ${aqTxt(w.air?.aqi)}`, w.air?.aqi > 60 ? 'warn' : 'ok'),
        seg(` · rain ${w.rainChance ?? '—'}% · ${w.pressure != null ? Math.round(w.pressure) : '—'} hPa`, 'dim')]);
      L.push([]);
      L.push([seg(' ' + pad('FORECAST', 9), 'lab'), seg(pad('DAY', 7), 'lab'), seg(pad('SKY', 18), 'lab'), seg(lpad('MAX', 5), 'lab'), seg(lpad('MIN', 5), 'lab'), seg(lpad('RAIN', 6), 'lab'), seg(lpad('UV', 4), 'lab')]);
      (w.days || []).slice(0, 4).forEach((d, i) => {
        const day = i === 0 ? 'today' : new Date(d.date + 'T12:00').toLocaleDateString(lang, { weekday: 'short' });
        L.push([seg(' ' + ' '.repeat(9)), seg(pad(day, 7), i === 0 ? 'hi' : ''), seg(pad(String(d.description || '').toLowerCase(), 18), 'dim'),
          seg(lpad(`${Math.round(d.max)}°`, 5), 'hi'), seg(lpad(`${Math.round(d.min)}°`, 5)), seg(lpad(`${d.rainChance ?? '—'}%`, 6), d.rainChance >= 60 ? 'acc' : ''), seg(lpad(d.uvMax != null ? Math.round(d.uvMax) : '—', 4), uvCls(d.uvMax))]);
      });
      L.push([]);
    }
  }

  if (o.showSun && w) {
    const today = (w.days || [])[0] || {};
    const hm = (iso) => (iso ? new Date(iso).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit', hour12: !o.format24 }) : '—');
    const sr = today.sunrise ? new Date(today.sunrise) : null, ss = today.sunset ? new Date(today.sunset) : null;
    let light = '';
    if (sr && ss) { const left = (ss - now) / 60000; light = now < sr ? 'before sunrise' : left > 0 ? `${Math.floor(left / 60)}h ${Math.round(left % 60)}m of light left` : 'after sunset'; }
    const syn = 29.530588853, age = ((((now.getTime() / 86400000) - Date.UTC(2000, 0, 6, 18, 14) / 86400000) % syn) + syn) % syn;
    const names = ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'last quarter', 'waning crescent'];
    const moon = `${names[Math.floor((age / syn) * 8 + 0.5) % 8]} ${Math.round((1 - Math.cos((2 * Math.PI * age) / syn)) / 2 * 100)}%`;
    L.push([seg(' ' + pad('SUN', 9), 'lab'), seg(`rise ${hm(today.sunrise)} · set ${hm(today.sunset)} · ${light}`), seg(`  moon ${moon}`, 'dim')]);
  }
  if (o.showMedia && media?.title) {
    L.push([seg(' ' + pad('MUSIC', 9), 'lab'), seg(`${media.playing ? '▶' : '❚❚'} `, 'acc'), seg(media.title, 'hi'), seg(media.artist ? ` — ${media.artist}` : '', 'dim')]);
  }
  L.push([]);
  L.push([seg(prompt), seg(' '), ['', 'cursor']]);
  return L;
}

function render() {
  const out = $('out');
  const frag = document.createDocumentFragment();
  lines().forEach((line, i) => {
    if (i) frag.append('\n');
    for (const [text, cls] of line) {
      if (cls === 'cursor') { const c = document.createElement('span'); c.className = 'cursor'; frag.append(c); continue; }
      if (!cls) { frag.append(text); continue; }
      const sp = document.createElement('span'); sp.className = cls; sp.textContent = text; frag.append(sp);
    }
  });
  out.replaceChildren(frag);
  fit();
}

// Font size: the widest line must fit the window width, and every line must fit the screen height.
function fit() {
  const win = $('win');
  const width = win.clientWidth;
  const count = $('out').textContent.split('\n').length + (o.titleBar ? 2 : 0) + 1;
  const byWidth = (width - 24) / (COLS * 0.6);
  const byHeight = (innerHeight * 0.93) / (count * 1.32);
  const size = Math.max(7, Math.min(byWidth * (o.fontSize || 1), byHeight));
  document.documentElement.style.setProperty('--fs', `${size.toFixed(2)}px`);
}

function applyLook() {
  const cls = [o.theme || 'cmd', `pos-${o.position || 'right'}`, `bg-${o.background || 'black'}`];
  if (Wallgates.paused) cls.push('paused');
  document.body.className = cls.join(' ');
  document.documentElement.style.setProperty('--w', `${o.width || 42}vw`);
  document.documentElement.style.setProperty('--op', o.opacity ?? 0.94);
  $('title').style.display = o.titleBar === false ? 'none' : 'flex';
  render();
}

async function typeCommand() {
  const cmd = 'wallgates status --live';
  $('titleText').textContent = `C:\\WINDOWS\\system32\\cmd.exe - ${cmd}`;
  if (!o.typing) { typed = cmd; typingDone = true; render(); return; }
  await new Promise((r) => setTimeout(r, 600));
  for (const ch of cmd) { typed += ch; render(); await new Promise((r) => setTimeout(r, 55 + Math.random() * 60)); }
  await new Promise((r) => setTimeout(r, 350));
  typingDone = true;
  render();
}

let started = false;
Wallgates.on('properties', (v) => { o = v; applyLook(); if (!started) { started = true; typeCommand(); } });
Wallgates.on('pause', () => applyLook());
Wallgates.on('system', (d) => {
  s = d;
  const sys = (d.drives || []).find((x) => /C:/i.test(x.letters || '')) || (d.drives || [])[0] || {};
  push(hist.cpu, d.cpu); push(hist.gpu, d.gpu?.usage); push(hist.ram, d.memory); push(hist.ssd, sys.active);
  if (!Wallgates.paused && typingDone) render();
});
Wallgates.on('weather', (d) => { w = d; if (typingDone) render(); });
Wallgates.on('media', (m) => { media = m; if (typingDone) render(); });
setInterval(() => { if (!Wallgates.paused && typingDone) render(); }, 1000);
addEventListener('resize', fit);
</script>
</body>
</html>
