<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Constellation — Wallgates built-in HTML wallpaper (GPL-3.0-or-later).
// Wallgates sends { type: 'wallgates', event, values, paused } via postMessage.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let opts = { count: 140, speed: 1, linkDistance: 140, color: '#8fb3ff', background: '#070912', glow: true };
let paused = false, particles = [], w = 0, h = 0, dpr = 1, raf = 0, last = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  w = innerWidth; h = innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function spawn() {
  const n = Math.round(opts.count);
  while (particles.length < n) particles.push({
    x: Math.random() * w, y: Math.random() * h,
    vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30, r: 1 + Math.random() * 1.8,
  });
  particles.length = n;
}
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = last ? Math.min((now - last) / 1000, .1) : 0; last = now;
  draw(dt);
}
function draw(dt) {
  ctx.fillStyle = opts.background; ctx.fillRect(0, 0, w, h);
  const [r, g, b] = rgb(opts.color);
  const d = opts.linkDistance, d2 = d * d;
  for (const p of particles) {
    p.x += p.vx * dt * opts.speed; p.y += p.vy * dt * opts.speed;
    if (p.x < 0 || p.x > w) p.vx *= -1;
    if (p.y < 0 || p.y > h) p.vy *= -1;
  }
  ctx.lineWidth = 1;
  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];
    for (let j = i + 1; j < particles.length; j++) {
      const p = particles[j], dx = a.x - p.x, dy = a.y - p.y, q = dx * dx + dy * dy;
      if (q < d2) {
        ctx.strokeStyle = `rgba(${r},${g},${b},${(1 - Math.sqrt(q) / d) * .5})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
    }
  }
  ctx.shadowBlur = opts.glow ? 12 : 0; ctx.shadowColor = opts.color; ctx.fillStyle = opts.color;
  for (const p of particles) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.shadowBlur = 0;
}
function setPaused(p) { paused = p; cancelAnimationFrame(raf); if (!p) { last = 0; raf = requestAnimationFrame(frame); } }

addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'wallgates') return;
  if (m.values) { opts = { ...opts, ...m.values }; spawn(); }
  if (m.paused !== paused) setPaused(m.paused);
  if (paused) draw(0); // show option changes even while paused
});
addEventListener('resize', () => { resize(); spawn(); });
resize(); spawn(); setPaused(false);
</script>
</body>
</html>
