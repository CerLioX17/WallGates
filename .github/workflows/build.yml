name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Gallery index is up to date
        run: |
          python3 scripts/build_gallery.py
          git diff --exit-code gallery/index.json

  # Publishes a release automatically the first time a new version reaches main
  # (bump "version" in src-tauri/tauri.conf.json to release). Pushing a v* tag also works.
  release:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.check.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          # Release notes: the matching section of CHANGELOG.md.
          version="${tag#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo "## Download"
            echo "- **Windows:** \`Wallgates_${version}_x64-setup.exe\` (recommended, no admin rights) or the \`.msi\`"
            echo "- **Linux:** \`.AppImage\` or \`.deb\`"
            echo
            echo "SHA-256 checksums: \`SHA256SUMS-*.txt\`. If Windows shows \"Windows protected your PC\", click **More info → Run anyway** (signed builds are coming)."
            echo
            cat notes.md
          } > body.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wallgates $tag" --notes-file body.md

  build:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci

      # On a v* tag this publishes a public GitHub Release with the installers
      # as plain files (zipped CI artifacts trip Chrome and antivirus heuristics).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release.outputs.publish == 'true' && needs.release.outputs.tag || '' }}
          releaseName: "Wallgates ${{ needs.release.outputs.tag }}"
          releaseDraft: false
          prerelease: false

      - name: Checksums
        if: needs.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          files=$(ls msi/*.msi nsis/*.exe deb/*.deb appimage/*.AppImage 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          out="SHA256SUMS-${{ runner.os }}.txt"
          sha256sum $files | sed 's#  [a-z]*/#  #' > "$out"
          cat "$out"
          gh release upload "${{ needs.release.outputs.tag }}" "$out" --clobber

      - uses: actions/upload-artifact@v4
        if: needs.release.outputs.publish != 'true'
        with:
          name: wallgates-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
