name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Gallery index is up to date
        run: |
          python3 scripts/build_gallery.py
          git diff --exit-code gallery/index.json

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci

      # On a v* tag this publishes a public GitHub Release with the installers
      # as plain files (zipped CI artifacts trip Chrome and antivirus heuristics).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Wallgates ${{ github.ref_name }}"
          releaseBody: |
            ## Download
            **Windows:** `Wallgates_x.y.z_x64-setup.exe` (recommended, no admin rights needed) or the `.msi`.
            **Linux:** `.AppImage` or `.deb`.

            SHA-256 checksums are in `SHA256SUMS.txt`. See the README for what's new.
          releaseDraft: false
          prerelease: false

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          files=$(ls msi/*.msi nsis/*.exe deb/*.deb appimage/*.AppImage 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          out="SHA256SUMS-${{ runner.os }}.txt"
          sha256sum $files | sed 's#  [a-z]*/#  #' > "$out"
          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: wallgates-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
